<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f9fafb;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        .app-name {
            font-size: 1.1rem;
            color: #6b7280;
            margin-bottom: 32px;
        }

        .last-updated {
            font-size: 0.9rem;
            color: #9ca3af;
            margin-bottom: 32px;
        }

        h2 {
            font-size: 1.3rem;
            margin-top: 32px;
            margin-bottom: 12px;
            color: #1a1a1a;
        }

        p {
            margin-bottom: 16px;
            color: #4b5563;
        }

        ul {
            margin-bottom: 16px;
            padding-left: 24px;
            color: #4b5563;
        }

        li {
            margin-bottom: 8px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid #e5e7eb;
            font-size: 0.85rem;
            color: #9ca3af;
        }

        /* App listing styles */
        .app-list {
            list-style: none;
            padding-left: 0;
        }

        .app-list li {
            margin-bottom: 12px;
        }

        .app-list a {
            display: block;
            padding: 16px 20px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .app-list a:hover {
            text-decoration: none;
            border-color: #2563eb;
            box-shadow: 0 1px 4px rgba(37, 99, 235, 0.1);
        }

        .app-list .app-link-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1a1a1a;
        }

        .app-list .app-link-date {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-top: 2px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 24px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container" id="content"></div>

    <script>
    /*
     * ========================================
     * APP CONFIGURATION
     * ========================================
     * To add a new app, simply add an entry to this array.
     * The "slug" is used in the URL: ?app=your-slug
     */
    const apps = [
        {
            slug: "water-tracker-lite",
            name: "Water Tracker Lite",
            lastUpdated: "March 9, 2026"
        },
        {
            slug: "pushlog-pushup-tracker",
            name: "PushLog - Pushup Tracker",
            lastUpdated: "March 22, 2026"
        }
    ];

    const contactLink = "https://github.com/NeuronCrafts";
    const orgName = "NeuronCrafts";

    function getAppSlug() {
        const params = new URLSearchParams(window.location.search);
        return params.get("app");
    }

    function renderAppList() {
        document.title = "Privacy Policies - " + orgName;
        const listItems = apps.map(function(app) {
            return '<li><a href="?app=' + encodeURIComponent(app.slug) + '">' +
                '<div class="app-link-name">' + app.name + '</div>' +
                '<div class="app-link-date">Last updated: ' + app.lastUpdated + '</div>' +
                '</a></li>';
        }).join("");

        document.getElementById("content").innerHTML =
            '<h1>Privacy Policies</h1>' +
            '<p class="app-name">' + orgName + '</p>' +
            '<p>Select an application to view its privacy policy:</p>' +
            '<ul class="app-list">' + listItems + '</ul>' +
            '<footer>&copy; ' + new Date().getFullYear() + ' ' + orgName + '. All rights reserved.</footer>';
    }

    function renderPrivacyPolicy(app) {
        document.title = "Privacy Policy - " + app.name;
        document.getElementById("content").innerHTML =
            '<a href="." class="back-link">&larr; All Privacy Policies</a>' +
            '<h1>Privacy Policy</h1>' +
            '<p class="app-name">' + app.name + '</p>' +
            '<p class="last-updated">Last updated: ' + app.lastUpdated + '</p>' +

            '<h2>Overview</h2>' +
            '<p>' + app.name + ' ("the App") is designed with your privacy in mind. We do not collect, store, or share any personal information.</p>' +

            '<h2>Data Collection</h2>' +
            '<p>The App does <strong>not</strong> collect any personal data. Specifically:</p>' +
            '<ul>' +
                '<li>No personal information is collected (name, email, phone number, etc.)</li>' +
                '<li>No usage analytics or tracking data is collected</li>' +
                '<li>No location data is collected</li>' +
                '<li>No cookies or similar tracking technologies are used</li>' +
            '</ul>' +

            '<h2>Data Storage</h2>' +
            '<p>All data you enter in the App is stored locally on your device. We do not have access to any of your data, and it is never transmitted to external servers.</p>' +

            '<h2>Third-Party Services</h2>' +
            '<p>The App does not use any third-party services that collect user data. There are no third-party analytics, advertising frameworks, or tracking tools integrated into the App.</p>' +

            '<h2>Children\'s Privacy</h2>' +
            '<p>The App does not collect any personal information from anyone, including children under the age of 13. The App is safe for use by all age groups.</p>' +

            '<h2>Changes to This Policy</h2>' +
            '<p>We may update this Privacy Policy from time to time. Any changes will be reflected on this page with an updated revision date.</p>' +

            '<h2>Contact Us</h2>' +
            '<p>If you have any questions about this Privacy Policy, please contact us at:</p>' +
            '<p><a href="' + contactLink + '">' + contactLink.replace('https://', '') + '</a></p>' +

            '<footer>&copy; ' + new Date().getFullYear() + ' ' + app.name + '. All rights reserved.</footer>';
    }

    function renderNotFound(slug) {
        document.title = "App Not Found";
        document.getElementById("content").innerHTML =
            '<a href="." class="back-link">&larr; All Privacy Policies</a>' +
            '<h1>App Not Found</h1>' +
            '<p>No privacy policy found for "' + slug + '".</p>';
    }

    // Route
    var slug = getAppSlug();
    if (!slug) {
        renderAppList();
    } else {
        var app = apps.find(function(a) { return a.slug === slug; });
        if (app) {
            renderPrivacyPolicy(app);
        } else {
            renderNotFound(slug);
        }
    }
    </script>
</body>
</html>
